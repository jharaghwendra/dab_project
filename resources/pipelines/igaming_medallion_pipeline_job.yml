resources:
  jobs:
    igaming_medallion_bronze_silver_de:
      name: "Medallion Bronze and Silver DE"
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - jharaghwendra@gmail.com
      # schedule:
      #   quartz_cron_expression: "0 */10 * * * ?"
      #   timezone_id: "UTC"
      #   pause_status: "UNPAUSED"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/dab_project-${var.wheel_version}-py3-none-any.whl
      tasks:
        - task_key: "00_wheel_task"
          min_retry_interval_millis: 60000
          max_retries: 2
          retry_on_timeout: true
          timeout_seconds: 3600
          environment_key: default
          spark_python_task:
            python_file: "../../src/dab_project/__init__.py"
            parameters: []
            source: WORKSPACE
        - task_key: "bronze_gametransaction_de"
          min_retry_interval_millis: 60000
          max_retries: 2
          retry_on_timeout: true
          timeout_seconds: 3600
          depends_on:
            - task_key: "00_wheel_task"
          environment_key: default
          spark_python_task:
            python_file: "../../gaming_lakehouse/scripts/01_bronze/igaming_s3_to_adls_bronze.py"
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--country_code"
              - "de"
              - "--table_name"
              - "ig_transaction"
            source: WORKSPACE
        - task_key: "silver_gametransaction_de"
          min_retry_interval_millis: 60000
          max_retries: 2
          retry_on_timeout: true
          timeout_seconds: 3600
          depends_on:
